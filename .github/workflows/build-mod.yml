name: Build Mega Laser 90 Mod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Fabric 1.21.1 Mod JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        run: gradle --no-daemon --stacktrace build
      - name: Verify output
        run: |
          test -s build/libs/megalaser90-1.1.0.jar
          unzip -p build/libs/megalaser90-1.1.0.jar fabric.mod.json | grep '"id": "megalaser90"'
      - uses: actions/upload-artifact@v4
        with:
          name: MegaLaser90-Cinematics-JAR
          path: build/libs/megalaser90-1.1.0.jar
          if-no-files-found: error
          retention-days: 30
